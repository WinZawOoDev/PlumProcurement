appId: com.plumprocurement
---
- launchApp:
    clearState: true
- tapOn:
    id: "btn-Skip"
- assertVisible: "Price Management"
- tapOn: "Add New Price"
- assertVisible: "Price Entry"
- tapOn: "e.g. 12.50"
- inputText: "12.50"
- tapOn:
    id: "btn-Save Price"
- assertVisible: "Price saved successfully!"
- assertVisible: "Price Management"
# Category section header is rendered uppercase on iOS, so match case-insensitively.
- assertVisible: '(?i)fruit'
- assertVisible: '.*12\.50.*'
