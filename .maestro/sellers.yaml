appId: com.plumprocurement
---
- launchApp:
    clearState: true
- tapOn:
    id: "btn-Skip"
- tapOn:
    id: "tab-sellers"
- assertVisible: "Add Seller"
- tapOn:
    id: "btn-Add Seller"
- tapOn: "e.g. U Ba"
- inputText: "E2E Seller"
- tapOn: "e.g. 09-123-456-789"
- inputText: "09-123-456-789"
- tapOn: "e.g. No. 123, Main Road"
- inputText: "123 Main Road"
- tapOn:
    id: "btn-Save"
- assertVisible: "Seller saved successfully!"
- assertVisible: "E2E Seller"
- assertVisible: "09-123-456-789"
- assertVisible: "123 Main Road"
