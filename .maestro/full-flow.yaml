appId: com.plumprocurement
---
- launchApp:
    clearState: true
- tapOn:
    id: "btn-Skip"
# Pricing: create a price (category/unit come from the form defaults: Fruit, CUP)
- assertVisible: "Price Management"
- tapOn: "Add New Price"
- assertVisible: "Price Entry"
- tapOn: "e.g. 12.50"
- inputText: "9.99"
- tapOn:
    id: "btn-Save Price"
- assertVisible: "Price saved successfully!"
# Sellers: create a seller (phone and address are mandatory)
- tapOn:
    id: "tab-sellers"
- tapOn:
    id: "btn-Add Seller"
- tapOn: "e.g. U Ba"
- inputText: "Flow Seller"
- tapOn: "e.g. 09-123-456-789"
- inputText: "09-123-456-789"
- tapOn: "e.g. No. 123, Main Road"
- inputText: "Flow Road 1"
- tapOn:
    id: "btn-Save"
- assertVisible: "Seller saved successfully!"
# Purchasing: price items are shown as cards (no tap needed); pick seller, then increase quantity
- tapOn:
    id: "tab-purchasing"
- assertVisible:
    id: "btn-Record Purchase"
- assertVisible: "Select a seller and a price item to set the quantity"
- tapOn: "Select seller"
- tapOn: "Flow Seller"
- tapOn: "Increase quantity Fruit"
- tapOn:
    id: "btn-Record Purchase"
- tapOn: "(?i)confirm"
- assertVisible: "Purchase recorded successfully!"
# History: CSV export is disabled in purchase history, so the flow stops at the recorded row
- tapOn:
    id: "btn-View History"
- assertVisible: "Purchase History"
- assertVisible: ".*Flow Seller.*"
