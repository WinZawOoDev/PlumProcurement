appId: com.plumprocurement
---
- launchApp
# Pricing
- assertVisible: "Price Management"
- tapOn: "Add New Price"
- tapOn: "CUP"
- inputText: "9.99"
- tapOn: "Save Price"
# Sellers
- tapOn: "Sellers"
- tapOn: "Add Seller"
- inputText: "Flow Seller"
- tapOn: "Save"
# Purchasing
- tapOn: "Purchasing"
- assertVisible: "Record Purchase"
- tapOn: "Flow Seller"
- tapOn: "CUP"
- inputText: "2"
- tapOn: "Record Purchase"
- assertVisible: "Purchase recorded successfully!"
- tapOn: "View History"
- assertVisible: "Purchase History"
- tapOn: "Export CSV"
