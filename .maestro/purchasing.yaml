appId: com.plumprocurement
---
- launchApp:
    clearState: true
- tapOn:
    id: "btn-Skip"
# Prerequisites: one price + one seller (form defaults: Fruit, CUP)
- tapOn: "Add New Price"
- tapOn: "e.g. 12.50"
- inputText: "5"
- tapOn:
    id: "btn-Save Price"
- assertVisible: "Price saved successfully!"
- tapOn:
    id: "tab-sellers"
- tapOn:
    id: "btn-Add Seller"
- tapOn: "e.g. U Ba"
- inputText: "Hist Seller"
- tapOn: "e.g. 09-123-456-789"
- inputText: "09-000-000-002"
- tapOn: "e.g. No. 123, Main Road"
- inputText: "Hist Road 2"
- tapOn:
    id: "btn-Save"
- assertVisible: "Seller saved successfully!"
# Record a purchase: pick the seller, then unlock the stepper via quantity
- tapOn:
    id: "tab-purchasing"
- assertVisible: "Record Purchase"
- assertVisible: "Select a seller and a price item to set the quantity"
- tapOn: "Select seller"
- tapOn: "Hist Seller"
- tapOn: "Increase quantity Fruit"
- tapOn:
    id: "btn-Record Purchase"
- tapOn: "Confirm"
- assertVisible: "Purchase recorded successfully!"
# History: CSV export is disabled in purchase history, so the flow stops at the recorded row
- tapOn:
    id: "btn-View History"
- assertVisible: "Purchase History"
- assertVisible: ".*Hist Seller.*"
