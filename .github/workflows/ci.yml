name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --ci --coverage
      - name: Maestro (validate flows)
        run: |
          if [ -d .maestro ]; then echo "Maestro flows: $(ls .maestro/*.yaml | wc -l)"; ls .maestro/*.yaml; else echo "no maestro"; fi
